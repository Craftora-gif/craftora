<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Login — Craftora</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:#faf7f2;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#29251f;
    padding:20px;
}

.login-wrapper{
    width:100%;
    max-width:430px;
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.brand h1{
    font-size:32px;
    letter-spacing:2px;
    color:#29251f;
}

.brand h1 span{
    color:#9b5b32;
}

.brand p{
    margin-top:7px;
    color:#777;
    font-size:14px;
}

.login-card{
    background:#fff;
    border-radius:18px;
    padding:35px;
    box-shadow:0 12px 40px rgba(0,0,0,.10);
    border:1px solid #eee;
}

.login-card h2{
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.form-group input{
    width:100%;
    padding:14px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
    background:#fff;
    transition:.2s;
}

.form-group input:focus{
    border-color:#9b5b32;
    box-shadow:0 0 0 3px rgba(155,91,50,.10);
}

.login-btn{
    width:100%;
    border:none;
    background:#9b5b32;
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#824a28;
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:18px;
    padding:12px 14px;
    border-radius:9px;
    font-size:14px;
    line-height:1.4;
}

.message.show{
    display:block;
}

.message.success{
    background:#edf8ef;
    color:#246b35;
    border:1px solid #bde4c5;
}

.message.error{
    background:#fff1f1;
    color:#a52d2d;
    border:1px solid #efc1c1;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#9b5b32;
    text-decoration:none;
    font-size:14px;
}

.back-link:hover{
    text-decoration:underline;
}

@media(max-width:500px){

    .login-card{
        padding:25px 20px;
    }

    .brand h1{
        font-size:27px;
    }

}

</style>

</head>

<body>

<div class="login-wrapper">

    <div class="brand">

        <h1>
            CRAFT<span>ORA</span>
        </h1>

        <p>
            Handmade with Love
        </p>

    </div>


    <div class="login-card">

        <h2>
            Admin Login
        </h2>

        <p class="subtitle">
            Sign in to manage Craftora.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form
            id="loginForm"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Website
        </a>

    </div>

</div>


<script>

/* =========================
   CRAFTORA API
========================= */

const API_URL =
    "https://craftora-nef4.onrender.com";


/* =========================
   ELEMENTS
========================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const messageBox =
    document.getElementById(
        "message"
    );


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    messageBox.innerText =
        text;

    messageBox.className =
        "message show " + type;

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            document.getElementById(
                "username"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;


        if(!username || !password){

            showMessage(
                "Please enter username and password.",
                "error"
            );

            return;

        }


        loginBtn.disabled =
            true;

        loginBtn.innerText =
            "Logging in...";


        messageBox.className =
            "message";


        try{

            const response =
                await fetch(
                    API_URL +
                    "/api/admin/login",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                password:
                                    password
                            })
                    }
                );


            let data = {};

            try{

                data =
                    await response.json();

            }
            catch(error){

                data = {};

            }


            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Unable to login."
                );

            }


            if(
                !data.success ||
                !data.token
            ){

                throw new Error(
                    data.message ||
                    "Admin login failed."
                );

            }


            /* =========================
               SAVE ADMIN TOKEN
            ========================= */

            sessionStorage.setItem(
                "craftoraAdminToken",
                data.token
            );

            sessionStorage.setItem(
                "craftoraAdminLoggedIn",
                "true"
            );


            showMessage(
                "Login successful. Opening admin panel...",
                "success"
            );


            loginBtn.innerText =
                "Login Successful";


            /* =========================
               GO ADMIN DASHBOARD
            ========================= */

            setTimeout(
                function(){

                    window.location.href =
                        "admin.html";

                },
                500
            );

        }
        catch(error){

            console.error(
                "Admin Login Error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to connect to server.",
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.innerText =
                "Login";

        }

    }
);


/* =========================
   IF ALREADY LOGGED IN
========================= */

const existingToken =
    sessionStorage.getItem(
        "craftoraAdminToken"
    );


if(existingToken){

    /*
       Token hone par direct
       admin dashboard open nahi kar rahe,
       taaki expired token ka issue
       na aaye.
    */

}

</script>

</body>
</html>
