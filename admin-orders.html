<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Orders — Craftora</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#faf7f2;
    color:#29251f;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.admin-header{
    background:#29251f;
    color:white;

    min-height:75px;

    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.admin-logo{
    font-size:24px;
    font-weight:bold;
    white-space:nowrap;
}

.admin-logo span{
    color:#c77a45;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-actions a,
.header-actions button{
    text-decoration:none;

    border:1px solid rgba(255,255,255,.3);

    background:transparent;

    color:white;

    padding:9px 14px;

    border-radius:7px;

    font-size:13px;

    cursor:pointer;
}

.header-actions a:hover,
.header-actions button:hover{
    background:rgba(255,255,255,.1);
}


/* =========================
   CONTAINER
========================= */

.container{
    width:92%;
    max-width:1250px;

    margin:0 auto;

    padding:45px 0 70px;
}


/* =========================
   TITLE
========================= */

.page-title{
    margin-bottom:30px;
}

.page-title small{
    color:#9b5b32;
    font-weight:bold;
    letter-spacing:1.5px;
    font-size:12px;
}

.page-title h1{
    font-size:34px;
    margin-top:8px;
}

.page-title p{
    color:#777;
    margin-top:8px;
    font-size:15px;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-bottom:35px;
}

.stat{
    background:white;

    border:1px solid #eee;

    border-radius:14px;

    padding:25px;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.05);
}

.stat h3{
    color:#777;

    font-size:12px;

    letter-spacing:1px;

    margin-bottom:12px;
}

.stat-number{
    font-size:30px;

    font-weight:bold;

    color:#9b5b32;
}


/* =========================
   LOADING
========================= */

.loading{
    background:white;

    border:1px solid #eee;

    border-radius:14px;

    padding:60px 20px;

    text-align:center;

    color:#777;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.05);
}


/* =========================
   EMPTY
========================= */

.empty{
    background:white;

    border:1px solid #eee;

    border-radius:14px;

    padding:60px 20px;

    text-align:center;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.05);
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

.empty h2{
    margin-bottom:8px;
}

.empty p{
    color:#777;
}


/* =========================
   ERROR
========================= */

.error-box{
    background:#fff3f3;

    border:1px solid #efc7c7;

    border-radius:14px;

    padding:35px 20px;

    text-align:center;

    color:#9b3030;
}

.error-icon{
    font-size:42px;
    margin-bottom:12px;
}

.error-box h2{
    margin-bottom:8px;
}

.error-box p{
    color:#a55a5a;
    margin-bottom:20px;
}

.retry-btn{
    border:none;

    background:#9b5b32;

    color:white;

    padding:12px 22px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

.retry-btn:hover{
    background:#7f4726;
}


/* =========================
   ORDER CARD
========================= */

.order-card{
    background:white;

    border:1px solid #e7e2dc;

    border-radius:16px;

    margin-bottom:25px;

    overflow:hidden;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.05);
}


/* =========================
   ORDER HEADER
========================= */

.order-header{
    background:#faf7f2;

    padding:20px 24px;

    border-bottom:1px solid #eee;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;
}

.order-number{
    font-size:18px;

    font-weight:bold;
}

.order-date{
    color:#777;

    font-size:13px;

    margin-top:6px;
}


/* =========================
   STATUS AREA
========================= */

.status-area{
    display:flex;

    align-items:center;

    gap:10px;
}

.status-area label{
    font-size:12px;

    font-weight:bold;

    color:#777;
}

.status-select{
    border:1px solid #ddd;

    border-radius:8px;

    padding:9px 12px;

    background:white;

    font-size:13px;

    cursor:pointer;

    outline:none;
}

.status-select:focus{
    border-color:#9b5b32;
}

.status-select:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.status-message{
    font-size:12px;

    min-width:55px;

    color:#777;
}


/* =========================
   CUSTOMER
========================= */

.customer-section{
    padding:24px;

    border-bottom:1px solid #eee;
}

.section-title{
    font-size:13px;

    font-weight:bold;

    color:#9b5b32;

    letter-spacing:1px;

    margin-bottom:15px;
}

.customer-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.customer-box{
    background:#fafafa;

    border:1px solid #eee;

    border-radius:9px;

    padding:14px;
}

.customer-box h4{
    color:#888;

    font-size:10px;

    letter-spacing:1px;

    margin-bottom:6px;
}

.customer-box p{
    font-size:14px;

    word-break:break-word;
}


/* =========================
   PRODUCTS
========================= */

.products-section{
    padding:24px;

    border-bottom:1px solid #eee;
}

.product-row{
    display:flex;

    align-items:center;

    gap:15px;

    padding:14px 0;

    border-bottom:1px solid #f0f0f0;
}

.product-row:last-child{
    border-bottom:none;
}

.product-image{
    width:65px;

    height:65px;

    border-radius:10px;

    border:1px solid #eee;

    background:#faf7f2;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    flex-shrink:0;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-image .emoji{
    font-size:30px;
}

.product-info{
    flex:1;
}

.product-name{
    font-weight:bold;

    font-size:15px;

    margin-bottom:5px;
}

.product-meta{
    color:#777;

    font-size:13px;
}

.product-price{
    font-weight:bold;

    font-size:15px;

    white-space:nowrap;
}


/* =========================
   FOOTER
========================= */

.order-footer{
    padding:20px 24px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;
}

.payment{
    color:#777;

    font-size:13px;
}

.payment strong{
    color:#29251f;
}

.total{
    font-size:16px;

    font-weight:bold;
}

.total span{
    color:#9b5b32;

    font-size:21px;

    margin-left:5px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .admin-header{
        padding:15px 4%;

        flex-direction:column;

        align-items:flex-start;
    }

    .header-actions{
        width:100%;

        flex-wrap:wrap;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .customer-grid{
        grid-template-columns:1fr;
    }

    .order-header{
        flex-direction:column;

        align-items:flex-start;
    }

    .status-area{
        width:100%;

        flex-wrap:wrap;
    }

}

@media(max-width:550px){

    .container{
        width:94%;

        padding-top:30px;
    }

    .page-title h1{
        font-size:27px;
    }

    .order-header,
    .customer-section,
    .products-section,
    .order-footer{
        padding:17px;
    }

    .product-row{
        align-items:flex-start;
    }

    .product-price{
        font-size:13px;
    }

    .order-footer{
        flex-direction:column;

        align-items:flex-start;
    }

}

</style>

</head>


<body>


<header class="admin-header">

    <div class="admin-logo">
        CRAFT<span>ORA</span> ADMIN
    </div>


    <div class="header-actions">

        <a href="admin.html">
            ← Dashboard
        </a>

        <a href="index.html">
            Website
        </a>

        <button
            type="button"
            onclick="adminLogout()"
        >
            Logout
        </button>

    </div>

</header>



<main class="container">


    <div class="page-title">

        <small>
            ADMIN DASHBOARD
        </small>

        <h1>
            Customer Orders 📦
        </h1>

        <p>
            View customer orders and update delivery status.
        </p>

    </div>



    <div class="stats">

        <div class="stat">

            <h3>
                TOTAL ORDERS
            </h3>

            <div
                class="stat-number"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat">

            <h3>
                PENDING ORDERS
            </h3>

            <div
                class="stat-number"
                id="pendingOrders"
            >
                0
            </div>

        </div>


        <div class="stat">

            <h3>
                TOTAL SALES
            </h3>

            <div
                class="stat-number"
                id="totalSales"
            >
                ₹0
            </div>

        </div>

    </div>



    <div
        id="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>


</main>



<script>

/* =========================
   CRAFTORA LIVE API
========================= */

const API_URL =
    "https://craftora-nef4.onrender.com";


/* =========================
   ADMIN TOKEN
========================= */

function getAdminToken(){

    return sessionStorage.getItem(
        "craftoraAdminToken"
    );

}


/* =========================
   CHECK LOGIN
========================= */

function checkAdminLogin(){

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}


/* =========================
   DATE FORMAT
========================= */

function formatDate(value){

    if(!value){

        return "N/A";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "N/A";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    const container =
        document.getElementById(
            "orders"
        );


    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    container.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/orders",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }
        catch(error){

            data = {};

        }


        /* =========================
           TOKEN EXPIRED
        ========================= */

        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load orders."
            );

        }


        const orders =
            Array.isArray(
                data.orders
            )
            ? data.orders
            : Array.isArray(data)
                ? data
                : [];


        /* =========================
           STATS
        ========================= */

        document.getElementById(
            "totalOrders"
        ).innerText =
            orders.length;


        const pending =
            orders.filter(
                function(order){

                    return (
                        order.status ===
                        "Pending"
                    );

                }
            ).length;


        document.getElementById(
            "pendingOrders"
        ).innerText =
            pending;


        const sales =
            orders.reduce(
                function(total,order){

                    return (
                        total +
                        Number(
                            order.total || 0
                        )
                    );

                },
                0
            );


        document.getElementById(
            "totalSales"
        ).innerText =
            "₹" +
            sales.toLocaleString(
                "en-IN"
            );


        /* =========================
           NO ORDERS
        ========================= */

        if(
            orders.length === 0
        ){

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        Customer orders will appear here
                        after a successful order is placed.
                    </p>

                </div>

            `;

            return;

        }


        /* =========================
           SORT NEWEST FIRST
        ========================= */

        orders.sort(
            function(a,b){

                return (
                    new Date(
                        b.createdAt || 0
                    ) -
                    new Date(
                        a.createdAt || 0
                    )
                );

            }
        );


        container.innerHTML =
            "";


        /* =========================
           RENDER ORDERS
        ========================= */

        orders.forEach(
            function(order){

                const customer =
                    order.customer || {};


                const items =
                    Array.isArray(
                        order.items
                    )
                    ? order.items
                    : [];


                let productsHTML =
                    "";


                if(
                    items.length === 0
                ){

                    productsHTML = `

                        <div class="product-row">

                            <div class="product-info">

                                <div class="product-name">
                                    No product information
                                </div>

                            </div>

                        </div>

                    `;

                }
                else{

                    items.forEach(
                        function(item){

                            const quantity =
                                Number(
                                    item.quantity
                                ) || 1;


                            const price =
                                Number(
                                    item.price
                                ) || 0;


                            const image =
                                item.image ||
                                "";


                            let imageHTML =
                                "";


                            if(image){

                                imageHTML = `

                                    <img
                                        src="${escapeHTML(image)}"
                                        alt="${escapeHTML(item.name || "Product")}"
                                        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                                    >

                                    <span
                                        class="emoji"
                                        style="display:none;"
                                    >
                                        🛍️
                                    </span>

                                `;

                            }
                            else{

                                imageHTML = `

                                    <span class="emoji">
                                        🛍️
                                    </span>

                                `;

                            }


                            productsHTML += `

                                <div class="product-row">

                                    <div class="product-image">

                                        ${imageHTML}

                                    </div>


                                    <div class="product-info">

                                        <div class="product-name">

                                            ${escapeHTML(
                                                item.name ||
                                                "Product"
                                            )}

                                        </div>


                                        <div class="product-meta">

                                            ₹${price.toLocaleString("en-IN")}
                                            ×
                                            ${quantity}

                                        </div>

                                    </div>


                                    <div class="product-price">

                                        ₹${(
                                            price *
                                            quantity
                                        ).toLocaleString("en-IN")}

                                    </div>

                                </div>

                            `;

                        }
                    );

                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                const currentStatus =
                    order.status ||
                    "Pending";


                const orderNumber =
                    order.orderNumber ||
                    (
                        order._id
                        ? String(
                            order._id
                        ).slice(-8).toUpperCase()
                        : "N/A"
                    );


                card.innerHTML = `

                    <div class="order-header">

                        <div>

                            <div class="order-number">

                                Order #${escapeHTML(
                                    orderNumber
                                )}

                            </div>


                            <div class="order-date">

                                ${formatDate(
                                    order.createdAt
                                )}

                            </div>

                        </div>


                        <div class="status-area">

                            <label>
                                STATUS
                            </label>


                            <select
                                class="status-select"
                                data-current="${escapeHTML(currentStatus)}"
                            >

                                <option
                                    value="Pending"
                                    ${currentStatus === "Pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    value="Confirmed"
                                    ${currentStatus === "Confirmed" ? "selected" : ""}
                                >
                                    Confirmed
                                </option>

                                <option
                                    value="Processing"
                                    ${currentStatus === "Processing" ? "selected" : ""}
                                >
                                    Processing
                                </option>

                                <option
                                    value="Shipped"
                                    ${currentStatus === "Shipped" ? "selected" : ""}
                                >
                                    Shipped
                                </option>

                                <option
                                    value="Out for Delivery"
                                    ${currentStatus === "Out for Delivery" ? "selected" : ""}
                                >
                                    Out for Delivery
                                </option>

                                <option
                                    value="Delivered"
                                    ${currentStatus === "Delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>

                                <option
                                    value="Cancelled"
                                    ${currentStatus === "Cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>


                            <span class="status-message"></span>

                        </div>

                    </div>



                    <div class="customer-section">

                        <div class="section-title">
                            CUSTOMER DETAILS
                        </div>


                        <div class="customer-grid">


                            <div class="customer-box">

                                <h4>
                                    NAME
                                </h4>

                                <p>
                                    ${escapeHTML(
                                        customer.name ||
                                        "N/A"
                                    )}
                                </p>

                            </div>


                            <div class="customer-box">

                                <h4>
                                    PHONE
                                </h4>

                                <p>
                                    ${escapeHTML(
                                        customer.phone ||
                                        "N/A"
                                    )}
                                </p>

                            </div>


                            <div class="customer-box">

                                <h4>
                                    EMAIL
                                </h4>

                                <p>
                                    ${escapeHTML(
                                        customer.email ||
                                        "N/A"
                                    )}
                                </p>

                            </div>


                            <div class="customer-box">

                                <h4>
                                    ADDRESS
                                </h4>

                                <p>
                                    ${escapeHTML(
                                        customer.address ||
                                        "N/A"
                                    )}
                                </p>

                            </div>


                            <div class="customer-box">

                                <h4>
                                    CITY
                                </h4>

                                <p>
                                    ${escapeHTML(
                                        customer.city ||
                                        "N/A"
                                    )}
                                </p>

                            </div>


                            <div class="customer-box">

                                <h4>
                                    PIN CODE
                                </h4>

                                <p>
                                    ${escapeHTML(
                                        customer.pincode ||
                                        "N/A"
                                    )}
                                </p>

                            </div>


                        </div>

                    </div>



                    <div class="products-section">

                        <div class="section-title">
                            PRODUCTS
                        </div>


                        ${productsHTML}

                    </div>



                    <div class="order-footer">

                        <div class="payment">

                            Payment:

                            <strong>
                                ${escapeHTML(
                                    String(
                                        order.paymentMethod ||
                                        "COD"
                                    ).toUpperCase()
                                )}
                            </strong>

                        </div>


                        <div class="total">

                            Total:

                            <span>

                                ₹${Number(
                                    order.total || 0
                                ).toLocaleString(
                                    "en-IN"
                                )}

                            </span>

                        </div>

                    </div>

                `;


                const select =
                    card.querySelector(
                        ".status-select"
                    );


                const message =
                    card.querySelector(
                        ".status-message"
                    );


                select.addEventListener(
                    "change",
                    function(){

                        updateOrderStatus(
                            order._id,
                            this.value,
                            this,
                            message
                        );

                    }
                );


                container.appendChild(
                    card
                );

            }
        );


    }
    catch(error){

        console.error(
            "Admin Orders Error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <div class="error-icon">
                    ⚠️
                </div>


                <h2>
                    Unable to Load Orders
                </h2>


                <p>
                    ${escapeHTML(
                        error.message ||
                        "Something went wrong."
                    )}
                </p>


                <button
                    class="retry-btn"
                    type="button"
                    onclick="loadOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =========================
   UPDATE ORDER STATUS
   NO ALERT
========================= */

async function updateOrderStatus(
    orderId,
    newStatus,
    selectElement,
    messageElement
){

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    const oldStatus =
        selectElement.getAttribute(
            "data-current"
        );


    selectElement.disabled =
        true;


    messageElement.innerText =
        "Saving...";


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/orders/" +
                orderId +
                "/status",
                {

                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify({
                            status:
                                newStatus
                        })

                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }
        catch(error){

            data = {};

        }


        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Status update failed."
            );

        }


        selectElement.setAttribute(
            "data-current",
            newStatus
        );


        messageElement.innerText =
            "✓ Saved";


        updatePendingCount(
            oldStatus,
            newStatus
        );


        setTimeout(
            function(){

                messageElement.innerText =
                    "";

            },
            1800
        );


    }
    catch(error){

        console.error(
            "Status Update Error:",
            error
        );


        selectElement.value =
            oldStatus;


        messageElement.innerText =
            "Failed";


        setTimeout(
            function(){

                messageElement.innerText =
                    "";

            },
            2200
        );

    }
    finally{

        selectElement.disabled =
            false;

    }

}


/* =========================
   PENDING COUNT
========================= */

function updatePendingCount(
    oldStatus,
    newStatus
){

    const element =
        document.getElementById(
            "pendingOrders"
        );


    let count =
        Number(
            element.innerText
        ) || 0;


    if(
        oldStatus === "Pending" &&
        newStatus !== "Pending"
    ){

        count--;

    }


    if(
        oldStatus !== "Pending" &&
        newStatus === "Pending"
    ){

        count++;

    }


    if(count < 0){

        count = 0;

    }


    element.innerText =
        count;

}


/* =========================
   LOGOUT
========================= */

async function adminLogout(){

    const token =
        getAdminToken();


    if(token){

        try{

            await fetch(
                API_URL +
                "/api/admin/logout",
                {
                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        }
        catch(error){

            console.error(
                "Logout Error:",
                error
            );

        }

    }


    sessionStorage.removeItem(
        "craftoraAdminToken"
    );

    sessionStorage.removeItem(
        "craftoraAdminLoggedIn"
    );


    window.location.href =
        "admin-login.html";

}
