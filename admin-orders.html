<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Orders — Craftora</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f2ed;
    color:#29251f;
}

.admin-header{
    background:#29251f;
    color:white;
    padding:20px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.admin-logo{
    font-size:25px;
    font-weight:bold;
}

.admin-logo span{
    color:#d99c63;
}

.header-actions{
    display:flex;
    gap:10px;
}

.header-actions a,
.header-actions button{
    padding:9px 15px;
    border:1px solid #aaa;
    border-radius:5px;
    background:transparent;
    color:white;
    text-decoration:none;
    cursor:pointer;
    font-size:13px;
}

.header-actions a:hover,
.header-actions button:hover{
    background:white;
    color:#29251f;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:45px 20px 80px;
}

.page-title{
    margin-bottom:30px;
}

.page-title small{
    color:#9b5b32;
    font-weight:bold;
    letter-spacing:2px;
}

.page-title h1{
    font-size:40px;
    margin:12px 0;
}

.page-title p{
    color:#777;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:35px;
}

.stat{
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.stat h3{
    color:#777;
    font-size:13px;
    margin-bottom:10px;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    color:#9b5b32;
}

.orders{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.order-card{
    background:white;
    border-radius:9px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.order-header{
    padding:20px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    border-bottom:1px solid #eee;
}

.order-id{
    font-weight:bold;
    font-size:17px;
}

.order-date{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.status-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.status-select{
    padding:9px 12px;
    border:1px solid #ddd;
    border-radius:5px;
    background:white;
    font-size:13px;
    cursor:pointer;
    outline:none;
}

.status-select:disabled{
    opacity:.6;
    cursor:wait;
}

.status-message{
    font-size:12px;
    min-width:60px;
}

.customer{
    padding:20px 25px;
    background:#faf7f2;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.customer-box h4{
    font-size:12px;
    color:#777;
    margin-bottom:5px;
}

.customer-box p{
    font-size:14px;
    word-break:break-word;
}

.products{
    padding:15px 25px;
}

.product{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.product:last-child{
    border-bottom:0;
}

.product-image{
    width:55px;
    height:55px;
    flex-shrink:0;
    border-radius:6px;
    background:#ead9c8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.product-info{
    flex:1;
}

.product-info h3{
    font-size:15px;
    margin-bottom:5px;
}

.product-info p{
    color:#777;
    font-size:13px;
}

.product-price{
    font-weight:bold;
}

.order-footer{
    padding:20px 25px;
    border-top:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.payment{
    color:#777;
    font-size:13px;
}

.total{
    font-size:21px;
    font-weight:bold;
}

.total span{
    color:#9b5b32;
}

.loading,
.empty,
.error{
    background:white;
    padding:60px 25px;
    border-radius:10px;
    text-align:center;
}

.loading{
    color:#777;
}

.empty-icon,
.error-icon{
    font-size:55px;
    margin-bottom:15px;
}

.empty p,
.error p{
    color:#777;
    margin-top:10px;
}

.retry{
    margin-top:20px;
    padding:11px 22px;
    border:0;
    border-radius:5px;
    background:#9b5b32;
    color:white;
    cursor:pointer;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .customer{
        grid-template-columns:1fr;
    }

    .order-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .order-footer{
        align-items:flex-start;
        flex-direction:column;
    }

}

@media(max-width:500px){

    .admin-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-actions{
        width:100%;
    }

    .header-actions a,
    .header-actions button{
        flex:1;
        text-align:center;
    }

    .page-title h1{
        font-size:32px;
    }

    .order-header,
    .customer,
    .products,
    .order-footer{
        padding-left:18px;
        padding-right:18px;
    }

    .status-area{
        width:100%;
        justify-content:space-between;
    }

}

</style>

</head>

<body>

<header class="admin-header">

    <div class="admin-logo">
        CRAFT<span>ORA</span> ADMIN
    </div>

    <div class="header-actions">

        <a href="admin.html">
            ← Admin Dashboard
        </a>

        <a href="index.html">
            Website
        </a>

        <button onclick="adminLogout()">
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <small>
            ADMIN DASHBOARD
        </small>

        <h1>
            Customer Orders 📦
        </h1>

        <p>
            View customer orders and update their status.
        </p>

    </div>


    <div class="stats">

        <div class="stat">

            <h3>
                TOTAL ORDERS
            </h3>

            <div
                class="stat-number"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat">

            <h3>
                PENDING ORDERS
            </h3>

            <div
                class="stat-number"
                id="pendingOrders"
            >
                0
            </div>

        </div>


        <div class="stat">

            <h3>
                TOTAL SALES
            </h3>

            <div
                class="stat-number"
                id="totalSales"
            >
                ₹0
            </div>

        </div>

    </div>


    <div
        class="orders"
        id="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>

</main>


<script>

const API_URL =
    "https://craftora-nef4.onrender.com";


/* =========================
   ADMIN TOKEN
========================= */

function getAdminToken(){

    return sessionStorage.getItem(
        "craftoraAdminToken"
    );

}


/* =========================
   CHECK ADMIN LOGIN
========================= */

function checkAdminLogin(){

    const token =
        getAdminToken();

    if(!token){

        window.location.href =
            "admin-login.html";

        return false;

    }

    return true;

}


/* =========================
   DATE
========================= */

function formatDate(value){

    if(!value){
        return "N/A";
    }

    const date =
        new Date(value);

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    const container =
        document.getElementById(
            "orders"
        );

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    container.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/orders",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load orders."
            );

        }


        const orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        document.getElementById(
            "totalOrders"
        ).innerText =
            orders.length;


        const pending =
            orders.filter(
                order =>
                    order.status === "Pending"
            ).length;


        document.getElementById(
            "pendingOrders"
        ).innerText =
            pending;


        const sales =
            orders.reduce(
                (
                    total,
                    order
                ) =>
                    total +
                    Number(
                        order.total || 0
                    ),
                0
            );


        document.getElementById(
            "totalSales"
        ).innerText =
            "₹" +
            sales.toLocaleString(
                "en-IN"
            );


        if(
            orders.length === 0
        ){

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        Customer orders will appear here.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        orders.forEach(
            function(order){

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "order-card";


                const customer =
                    order.customer || {};

                const user =
                    typeof order.userId === "object"
                        ? order.userId
                        : {};


                const status =
                    order.status ||
                    "Pending";


                let productsHTML = "";


                const items =
                    Array.isArray(order.items)
                        ? order.items
                        : [];


                items.forEach(
                    function(item){

                        const quantity =
                            Number(
                                item.quantity || 1
                            );

                        const price =
                            Number(
                                item.price || 0
                            );

                        const itemTotal =
                            price * quantity;


                        productsHTML += `

                            <div class="product">

                                <div class="product-image">
                                    ${item.image || "🛍️"}
                                </div>

                                <div class="product-info">

                                    <h3>
                                        ${item.name || "Product"}
                                    </h3>

                                    <p>
                                        Quantity:
                                        ${quantity}
                                    </p>

                                </div>

                                <div class="product-price">
                                    ₹${itemTotal.toLocaleString("en-IN")}
                                </div>

                            </div>

                        `;

                    }
                );


                card.innerHTML = `

                    <div class="order-header">

                        <div>

                            <div class="order-id">
                                Order #${order.orderNumber || order._id}
                            </div>

                            <div class="order-date">
                                ${formatDate(order.createdAt)}
                            </div>

                        </div>


                        <div class="status-area">

                            <select
                                class="status-select"
                                data-current="${status}"
                            >

                                <option
                                    value="Pending"
                                    ${status === "Pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    value="Confirmed"
                                    ${status === "Confirmed" ? "selected" : ""}
                                >
                                    Confirmed
                                </option>

                                <option
                                    value="Shipped"
                                    ${status === "Shipped" ? "selected" : ""}
                                >
                                    Shipped
                                </option>

                                <option
                                    value="Delivered"
                                    ${status === "Delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>

                                <option
                                    value="Cancelled"
                                    ${status === "Cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>

                            <span class="status-message"></span>

                        </div>

                    </div>


                    <div class="customer">

                        <div class="customer-box">

                            <h4>
                                CUSTOMER
                            </h4>

                            <p>
                                ${
                                    customer.name ||
                                    user.name ||
                                    "N/A"
                                }
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                MOBILE
                            </h4>

                            <p>
                                ${
                                    customer.phone ||
                                    user.phone ||
                                    user.mobile ||
                                    "N/A"
                                }
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                EMAIL
                            </h4>

                            <p>
                                ${
                                    customer.email ||
                                    user.email ||
                                    "N/A"
                                }
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                ADDRESS
                            </h4>

                            <p>
                                ${
                                    customer.address ||
                                    "N/A"
                                }
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                CITY
                            </h4>

                            <p>
                                ${
                                    customer.city ||
                                    "N/A"
                                }
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                PIN CODE
                            </h4>

                            <p>
                                ${
                                    customer.pincode ||
                                    "N/A"
                                }
                            </p>

                        </div>

                    </div>


                    <div class="products">

                        ${
                            productsHTML ||
                            `
                            <p style="color:#777;">
                                No product information.
                            </p>
                            `
                        }

                    </div>


                    <div class="order-footer">

                        <div class="payment">

                            Payment:
                            <strong>
                                ${
                                    String(
                                        order.paymentMethod ||
                                        "COD"
                                    ).toUpperCase()
                                }
                            </strong>

                        </div>


                        <div class="total">

                            Total:

                            <span>
                                ₹${Number(
                                    order.total || 0
                                ).toLocaleString("en-IN")}
                            </span>

                        </div>

                    </div>

                `;


                const select =
                    card.querySelector(
                        ".status-select"
                    );


                const message =
                    card.querySelector(
                        ".status-message"
                    );


                select.addEventListener(
                    "change",
                    function(){

                        updateOrderStatus(
                            order._id,
                            this.value,
                            this,
                            message
                        );

                    }
                );


                container.appendChild(
                    card
                );

            }
        );

    }
    catch(error){

        console.error(
            "Admin orders error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <div class="error-icon">
                    ⚠️
                </div>

                <h2>
                    Unable to Load Orders
                </h2>

                <p>
                    ${error.message}
                </p>

                <button
                    class="retry"
                    onclick="loadOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =========================
   UPDATE STATUS
   NO ALERT
========================= */

async function updateOrderStatus(
    orderId,
    newStatus,
    selectElement,
    messageElement
){

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    const oldStatus =
        selectElement.getAttribute(
            "data-current"
        );


    selectElement.disabled =
        true;


    messageElement.innerText =
        "Saving...";


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/orders/" +
                orderId +
                "/status",
                {

                    method:"PATCH",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        JSON.stringify({
                            status:newStatus
                        })

                }
            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Status update failed."
            );

        }


        selectElement.setAttribute(
            "data-current",
            newStatus
        );


        messageElement.innerText =
            "✓ Saved";


        updatePendingCount(
            oldStatus,
            newStatus
        );


        setTimeout(
            function(){

                messageElement.innerText =
                    "";

            },
            1500
        );

    }
    catch(error){

        console.error(
            "Status update error:",
            error
        );


        selectElement.value =
            oldStatus;


        messageElement.innerText =
            "Failed";


        setTimeout(
            function(){

                messageElement.innerText =
                    "";

            },
            2000
        );

    }
    finally{

        selectElement.disabled =
            false;

    }

}


/* =========================
   PENDING COUNT
========================= */

function updatePendingCount(
    oldStatus,
    newStatus
){

    const element =
        document.getElementById(
            "pendingOrders"
        );


    let count =
        Number(
            element.innerText
        ) || 0;


    if(
        oldStatus === "Pending" &&
        newStatus !== "Pending"
    ){

        count--;

    }


    if(
        oldStatus !== "Pending" &&
        newStatus === "Pending"
    ){

        count++;

    }


    if(count < 0){
        count = 0;
    }


    element.innerText =
        count;

}


/* =========================
   LOGOUT
========================= */

async function adminLogout(){

    const token =
        getAdminToken();


    if(token){

        try{

            await fetch(
                API_URL +
                "/api/admin/logout",
                {

                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }

                }
            );

        }
        catch(error){

            console.error(
                error
            );

        }

    }


    sessionStorage.removeItem(
        "craftoraAdminToken"
    );

    sessionStorage.removeItem(
        "craftoraAdminLoggedIn"
    );


    window.location.href =
        "admin-login.html";

}


/* =========================
   START
========================= */

if(
    checkAdminLogin()
){

    loadOrders();

}

</script>

</body>
</html>
