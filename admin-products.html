<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Products — Craftora</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#faf7f2;
    color:#29251f;
    min-height:100vh;
}

header{
    background:#29251f;
    color:white;
    min-height:75px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#c77a45;
}

.header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.header-actions a,
.header-actions button{
    text-decoration:none;
    border:1px solid rgba(255,255,255,.3);
    background:transparent;
    color:white;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

.header-actions a:hover,
.header-actions button:hover{
    background:rgba(255,255,255,.1);
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
    padding:45px 0 70px;
}

.page-title{
    margin-bottom:30px;
}

.page-title small{
    color:#9b5b32;
    font-weight:bold;
    letter-spacing:1.5px;
    font-size:12px;
}

.page-title h1{
    font-size:34px;
    margin-top:8px;
}

.page-title p{
    color:#777;
    margin-top:8px;
}

.message{
    display:none;
    padding:13px 16px;
    border-radius:9px;
    margin-bottom:20px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#edf8ef;
    color:#246b35;
    border:1px solid #bde4c5;
}

.message.error{
    display:block;
    background:#fff1f1;
    color:#a52d2d;
    border:1px solid #efc1c1;
}

.layout{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:25px;
    align-items:start;
}

.card{
    background:white;
    border:1px solid #eee;
    border-radius:14px;
    padding:25px;
    box-shadow:0 7px 25px rgba(0,0,0,.05);
}

.card h2{
    font-size:20px;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:14px;
    background:white;
}

.form-group textarea{
    min-height:85px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#9b5b32;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.primary-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#9b5b32;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.primary-btn:hover{
    background:#7f4726;
}

.primary-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.secondary-btn{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    color:#555;
    cursor:pointer;
    margin-top:9px;
}

.secondary-btn:hover{
    border-color:#9b5b32;
    color:#9b5b32;
}

.products-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.products-count{
    color:#777;
    font-size:13px;
}

.refresh-btn{
    border:1px solid #9b5b32;
    color:#9b5b32;
    background:white;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
}

.refresh-btn:hover{
    background:#9b5b32;
    color:white;
}

.product-list{
    display:grid;
    gap:15px;
}

.product-card{
    border:1px solid #eee;
    border-radius:12px;
    padding:17px;
    display:flex;
    gap:15px;
    align-items:flex-start;
}

.product-image{
    width:75px;
    height:75px;
    border-radius:10px;
    background:#faf7f2;
    border:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    font-size:32px;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-info{
    flex:1;
    min-width:0;
}

.product-name{
    font-size:16px;
    font-weight:bold;
    margin-bottom:5px;
}

.product-meta{
    color:#777;
    font-size:13px;
    line-height:1.7;
}

.product-price{
    color:#9b5b32;
    font-weight:bold;
    font-size:16px;
}

.product-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
    flex-wrap:wrap;
}

.edit-btn,
.delete-btn{
    padding:7px 11px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
}

.edit-btn{
    border:1px solid #9b5b32;
    background:white;
    color:#9b5b32;
}

.delete-btn{
    border:1px solid #c0392b;
    background:white;
    color:#c0392b;
}

.edit-btn:hover{
    background:#9b5b32;
    color:white;
}

.delete-btn:hover{
    background:#c0392b;
    color:white;
}

.loading{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.error-box{
    text-align:center;
    padding:40px 20px;
    background:#fff3f3;
    border:1px solid #efc7c7;
    border-radius:10px;
    color:#a52d2d;
}

.retry-btn{
    margin-top:15px;
    padding:10px 20px;
    border:0;
    border-radius:7px;
    background:#9b5b32;
    color:white;
    cursor:pointer;
}

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    header{
        padding:15px 4%;
        align-items:flex-start;
        flex-direction:column;
    }

    .container{
        width:94%;
        padding-top:30px;
    }

    .page-title h1{
        font-size:28px;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .product-card{
        flex-wrap:wrap;
    }

}

</style>

</head>

<body>


<header>

    <div class="logo">
        CRAFT<span>ORA</span> ADMIN
    </div>

    <div class="header-actions">

        <a href="admin.html">
            ← Dashboard
        </a>

        <a href="admin-orders.html">
            Orders
        </a>

        <a href="index.html">
            Website
        </a>

        <button
            type="button"
            onclick="logoutAdmin()"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">


    <div class="page-title">

        <small>
            ADMIN DASHBOARD
        </small>

        <h1>
            Manage Products 🛍️
        </h1>

        <p>
            Add, edit and manage Craftora products.
        </p>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div class="layout">


        <!-- ADD / EDIT PRODUCT -->

        <div class="card">

            <h2 id="formTitle">
                Add New Product
            </h2>


            <form id="productForm">


                <div class="form-group">

                    <label>
                        Product Name *
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Handmade Vase"
                        required
                    >

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label>
                            Price *
                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            placeholder="1599"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Stock
                        </label>

                        <input
                            type="number"
                            id="productStock"
                            placeholder="10"
                            min="0"
                            value="0"
                        >

                    </div>


                </div>


                <div class="form-group">

                    <label>
                        Product ID *
                    </label>

                    <input
                        type="text"
                        id="productId"
                        placeholder="handmade-vase"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select id="productCategory">

                        <option value="Other">
                            Other
                        </option>

                        <option value="Home Decor">
                            Home Decor
                        </option>

                        <option value="Jewellery">
                            Jewellery
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Bags">
                            Bags
                        </option>

                        <option value="Art">
                            Art
                        </option>

                        <option value="Gifts">
                            Gifts
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Image URL
                    </label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Describe the product..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                    id="saveButton"
                >
                    Add Product
                </button>


                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelButton"
                    onclick="cancelEdit()"
                    style="display:none;"
                >
                    Cancel Edit
                </button>


            </form>

        </div>



        <!-- PRODUCT LIST -->

        <div class="card">

            <div class="products-top">

                <div>

                    <h2 style="margin-bottom:5px;">
                        Products
                    </h2>

                    <div
                        class="products-count"
                        id="productsCount"
                    >
                        Loading...
                    </div>

                </div>


                <button
                    type="button"
                    class="refresh-btn"
                    onclick="loadProducts()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div
                class="product-list"
                id="productList"
            >

                <div class="loading">
                    Loading products...
                </div>

            </div>

        </div>


    </div>

</main>


<script>

/* =========================
   LIVE API
========================= */

const API_URL =
    "https://craftora-nef4.onrender.com";


/* =========================
   VARIABLES
========================= */

let editingProductId =
    null;


/* =========================
   TOKEN
========================= */

function getAdminToken(){

    return sessionStorage.getItem(
        "craftoraAdminToken"
    );

}


/* =========================
   CHECK LOGIN
========================= */

function checkAdminLogin(){

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.className =
        "message " + type;


    box.innerText =
        text;


    setTimeout(
        function(){

            box.className =
                "message";

        },
        2500
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    const list =
        document.getElementById(
            "productList"
        );


    const count =
        document.getElementById(
            "productsCount"
        );


    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    list.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    count.innerText =
        "Loading...";


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/products",
                {

                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }

                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }
        catch(error){

            data = {};

        }


        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load products."
            );

        }


        const products =
            Array.isArray(
                data.products
            )
            ? data.products
            : Array.isArray(data)
                ? data
                : [];


        count.innerText =
            products.length +
            (
                products.length === 1
                    ? " product"
                    : " products"
            );


        if(
            products.length === 0
        ){

            list.innerHTML = `

                <div class="empty">

                    <div style="font-size:45px;">
                        🛍️
                    </div>

                    <h3 style="margin:15px 0 8px;">
                        No Products Yet
                    </h3>

                    <p>
                        Add your first product using the form.
                    </p>

                </div>

            `;

            return;

        }


        list.innerHTML =
            "";


        products.forEach(
            function(product){

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";


                const image =
                    product.image ||
                    "";


                let imageHTML;


                if(image){

                    imageHTML = `

                        <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(product.name)}"
                            onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
                        >

                        <span
                            style="display:none;"
                        >
                            🛍️
                        </span>

                    `;

                }
                else{

                    imageHTML = `
                        🛍️
                    `;

                }


                card.innerHTML = `

                    <div class="product-image">

                        ${imageHTML}

                    </div>


                    <div class="product-info">

                        <div class="product-name">

                            ${escapeHTML(
                                product.name ||
                                "Unnamed Product"
                            )}

                        </div>


                        <div class="product-price">

                            ₹${Number(
                                product.price || 0
                            ).toLocaleString(
                                "en-IN"
                            )}

                        </div>


                        <div class="product-meta">

                            Product ID:
                            ${escapeHTML(
                                product.productId ||
                                "N/A"
                            )}

                            <br>

                            Category:
                            ${escapeHTML(
                                product.category ||
                                "Other"
                            )}

                            <br>

                            Stock:
                            ${Number(
                                product.stock || 0
                            )}

                        </div>


                        <div class="product-actions">

                            <button
                                type="button"
                                class="edit-btn"
                            >
                                Edit
                            </button>


                            <button
                                type="button"
                                class="delete-btn"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                `;


                card
                    .querySelector(
                        ".edit-btn"
                    )
                    .addEventListener(
                        "click",
                        function(){

                            editProduct(
                                product
                            );

                        }
                    );


                card
                    .querySelector(
                        ".delete-btn"
                    )
                    .addEventListener(
                        "click",
                        function(){

                            deleteProduct(
                                product._id,
                                product.name
                            );

                        }
                    );


                list.appendChild(
                    card
                );

            }
        );


    }
    catch(error){

        console.error(
            "Admin Products Error:",
            error
        );


        count.innerText =
            "Unable to load";


        list.innerHTML = `

            <div class="error-box">

                <div style="font-size:40px;">
                    ⚠️
                </div>

                <h3 style="margin:12px 0 8px;">
                    Unable to Load Products
                </h3>

                <p>
                    ${escapeHTML(
                        error.message ||
                        "Something went wrong."
                    )}
                </p>

                <button
                    type="button"
                    class="retry-btn"
                    onclick="loadProducts()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =========================
   ADD / EDIT PRODUCT
========================= */

document
    .getElementById(
        "productForm"
    )
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const token =
                getAdminToken();


            if(!token){

                window.location.href =
                    "admin-login.html";

                return;

            }


            const name =
                document
                .getElementById(
                    "productName"
                )
                .value
                .trim();


            const price =
                document
                .getElementById(
                    "productPrice"
                )
                .value;


            const productId =
                document
                .getElementById(
                    "productId"
                )
                .value
                .trim();


            const stock =
                document
                .getElementById(
                    "productStock"
                )
                .value;


            const category =
                document
                .getElementById(
                    "productCategory"
                )
                .value;


            const image =
                document
                .getElementById(
                    "productImage"
                )
                .value
                .trim();


            const description =
                document
                .getElementById(
                    "productDescription"
                )
                .value
                .trim();


            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            if(
                !name ||
                price === "" ||
                !productId
            ){

                showMessage(
                    "Product name, price and product ID are required.",
                    "error"
                );

                return;

            }


            saveButton.disabled =
                true;


            saveButton.innerText =
                editingProductId
                    ? "Saving Changes..."
                    : "Adding Product...";


            try{

                const url =
                    editingProductId
                    ? API_URL +
                        "/api/admin/products/" +
                        editingProductId
                    : API_URL +
                        "/api/admin/products";


                const method =
                    editingProductId
                    ? "PUT"
                    : "POST";


                const response =
                    await fetch(
                        url,
                        {

                            method:method,

                            headers:{
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token
                            },

                            body:
                                JSON.stringify({

                                    name:
                                        name,

                                    price:
                                        Number(price),

                                    image:
                                        image,

                                    description:
                                        description,

                                    category:
                                        category,

                                    stock:
                                        Number(stock || 0),

                                    productId:
                                        productId

                                })

                        }
                    );


                let data = {};


                try{

                    data =
                        await response.json();

                }
                catch(error){

                    data = {};

                }


                if(
                    response.status === 401
                ){

                    sessionStorage.removeItem(
                        "craftoraAdminToken"
                    );

                    sessionStorage.removeItem(
                        "craftoraAdminLoggedIn"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;

                }


                if(!response.ok){

                    throw new Error(
                        data.message ||
                        (
                            editingProductId
                            ? "Unable to update product."
                            : "Unable to add product."
                        )
                    );

                }


                showMessage(
                    data.message ||
                    (
                        editingProductId
                        ? "Product updated successfully!"
                        : "Product added successfully!"
                    ),
                    "success"
                );


                resetForm();


                await loadProducts();

            }
            catch(error){

                console.error(
                    "Save Product Error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to save product.",
                    "error"
                );

            }
            finally{

                saveButton.disabled =
                    false;

                saveButton.innerText =
                    editingProductId
                    ? "Save Changes"
                    : "Add Product";

            }

        }
    );


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(
    product
){

    editingProductId =
        product._id;


    document.getElementById(
        "formTitle"
    ).innerText =
        "Edit Product";


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price || "";


    document.getElementById(
        "productId"
    ).value =
        product.productId || "";


    document.getElementById(
        "productStock"
    ).value =
        product.stock || 0;


    document.getElementById(
        "productCategory"
    ).value =
        product.category || "Other";


    document.getElementById(
        "productImage"
    ).value =
        product.image || "";


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    document.getElementById(
        "saveButton"
    ).innerText =
        "Save Changes";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

    resetForm();

}


/* =========================
   RESET FORM
========================= */

function resetForm(){

    editingProductId =
        null;


    document.getElementById(
        "productForm"
    ).reset();


    document.getElementById(
        "productCategory"
    ).value =
        "Other";


    document.getElementById(
        "productStock"
    ).value =
        "0";


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add New Product";


    document.getElementById(
        "saveButton"
    ).innerText =
        "Add Product";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(
    productId,
    productName
){

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    /*
       Browser confirmation is used here
       instead of an OK alert.
    */

    const confirmed =
        window.confirm(
            "Delete " +
            productName +
            "?"
        );


    if(!confirmed){

        return;

    }


    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/products/" +
                productId,
                {

                    method:"DELETE",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }

                }
            );


        let data = {};


        try{

            data =
                await response.json();

        }
        catch(error){

            data = {};

        }


        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to delete product."
            );

        }


        showMessage(
            data.message ||
            "Product deleted successfully.",
            "success"
        );


        await loadProducts();

    }
    catch(error){

        console.error(
            "Delete Product Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to delete product.",
            "error"
        );

    }

}

   LOGOUT
========================= */

async function logoutAdmin(){

    const token =
        getAdminToken();


    if(token){

        try{

            await fetch(
                API_URL +
                "/api/admin/logout",
                {

                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }

                }
            );

        }
        catch(error){

            console.error(
                "Logout Error:",
                error
            );

        }

    }


    sessionStorage.removeItem(
        "craftoraAdminToken"
    );

    sessionStorage.removeItem(
        "craftoraAdminLoggedIn"
    );


    window.location.href =
        "admin-login.html";

}
