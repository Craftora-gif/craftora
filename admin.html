<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Panel — Craftora</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f2ed;
    color:#29251f;
}


/* =========================
   HEADER
========================= */

.admin-header{
    background:#29251f;
    color:white;

    padding:18px 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.admin-logo{
    font-size:25px;
    font-weight:bold;
}

.admin-logo span{
    color:#d99c63;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-btn{
    text-decoration:none;

    color:white;

    border:1px solid #999;

    background:transparent;

    padding:9px 14px;

    border-radius:6px;

    font-size:13px;

    cursor:pointer;

    transition:.2s;
}

.header-btn:hover{
    background:white;
    color:#29251f;
}

.products-btn{
    border-color:#d99c63;
    color:#f0c49d;
}

.products-btn:hover{
    background:#d99c63;
    color:white;
}


/* =========================
   MAIN
========================= */

.container{
    max-width:1200px;

    margin:auto;

    padding:45px 20px 80px;
}

.page-title{
    margin-bottom:30px;
}

.page-title small{
    color:#9b5b32;

    font-weight:bold;

    letter-spacing:2px;
}

.page-title h1{
    font-size:40px;

    margin:12px 0;
}

.page-title p{
    color:#777;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-bottom:35px;
}

.stat{
    background:white;

    padding:25px;

    border-radius:9px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.05);
}

.stat h3{
    color:#777;

    font-size:14px;

    margin-bottom:10px;
}

.stat-number{
    font-size:30px;

    font-weight:bold;

    color:#9b5b32;
}


/* =========================
   ORDERS
========================= */

.orders{
    display:flex;

    flex-direction:column;

    gap:20px;
}

.order-card{
    background:white;

    border-radius:9px;

    overflow:hidden;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.05);
}


/* =========================
   ORDER HEADER
========================= */

.order-header{
    padding:20px 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    border-bottom:1px solid #eee;
}

.order-id{
    font-weight:bold;

    font-size:17px;
}

.order-date{
    color:#777;

    font-size:13px;

    margin-top:5px;
}


/* =========================
   STATUS
========================= */

.status-area{
    display:flex;

    align-items:center;

    gap:10px;
}

.status-select{
    padding:9px 12px;

    border:1px solid #ddd;

    border-radius:5px;

    background:white;

    font-size:13px;

    cursor:pointer;

    outline:none;
}

.status-select:focus{
    border-color:#9b5b32;
}

.status-select:disabled{
    opacity:.6;

    cursor:wait;
}

.status-message{
    font-size:12px;

    color:#2e7d32;

    min-width:70px;
}


/* =========================
   CUSTOMER
========================= */

.customer{
    padding:20px 25px;

    background:#faf7f2;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}

.customer-box h4{
    font-size:12px;

    color:#777;

    margin-bottom:5px;
}

.customer-box p{
    font-size:14px;

    word-break:break-word;
}


/* =========================
   ORDER PRODUCTS
========================= */

.products{
    padding:15px 25px;
}

.product{
    display:flex;

    align-items:center;

    gap:15px;

    padding:15px 0;

    border-bottom:1px solid #eee;
}

.product:last-child{
    border-bottom:0;
}

.product-image{
    width:55px;

    height:55px;

    flex-shrink:0;

    border-radius:6px;

    background:
        linear-gradient(
            135deg,
            #e9d8c7,
            #c69b73
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:26px;
}

.product-info{
    flex:1;
}

.product-info h3{
    font-size:15px;

    margin-bottom:5px;
}

.product-info p{
    color:#777;

    font-size:13px;
}

.product-price{
    font-weight:bold;
}


/* =========================
   FOOTER
========================= */

.order-footer{
    padding:20px 25px;

    border-top:1px solid #eee;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.payment{
    color:#777;

    font-size:13px;
}

.total{
    font-size:21px;

    font-weight:bold;
}

.total span{
    color:#9b5b32;
}


/* =========================
   EMPTY
========================= */

.empty{
    background:white;

    padding:70px 25px;

    border-radius:10px;

    text-align:center;
}

.empty-icon{
    font-size:60px;

    margin-bottom:15px;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#777;
}


/* =========================
   LOADING
========================= */

.loading{
    background:white;

    border-radius:10px;

    text-align:center;

    padding:60px;

    color:#777;
}


/* =========================
   ERROR
========================= */

.error-box{
    background:white;

    padding:60px 25px;

    border-radius:10px;

    text-align:center;
}

.error-icon{
    font-size:55px;

    margin-bottom:15px;
}

.error-box p{
    color:#777;

    margin:10px 0 20px;
}

.retry{
    padding:11px 22px;

    border:0;

    border-radius:5px;

    background:#9b5b32;

    color:white;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .customer{
        grid-template-columns:1fr;
    }

    .order-header{
        align-items:flex-start;

        flex-direction:column;
    }

    .order-footer{
        align-items:flex-start;

        flex-direction:column;
    }

}

@media(max-width:600px){

    .admin-header{
        align-items:flex-start;

        flex-direction:column;
    }

    .header-actions{
        width:100%;

        flex-wrap:wrap;
    }

    .header-btn{
        flex:1;

        text-align:center;

        min-width:100px;
    }

    .page-title h1{
        font-size:32px;
    }

    .customer,
    .products,
    .order-footer,
    .order-header{
        padding-left:18px;
        padding-right:18px;
    }

    .status-area{
        width:100%;

        justify-content:space-between;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="admin-header">

    <div class="admin-logo">
        CRAFT<span>ORA</span> ADMIN
    </div>


    <div class="header-actions">


        <a
            href="admin-products.html"
            class="header-btn products-btn"
        >
            🛍️ Products
        </a>


        <a
            href="index.html"
            class="header-btn"
        >
            ← Website
        </a>


        <button
            class="header-btn"
            onclick="adminLogout()"
        >
            Logout
        </button>


    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <div class="page-title">

        <small>
            ADMIN DASHBOARD
        </small>

        <h1>
            Orders 📦
        </h1>

        <p>
            Manage and update Craftora customer orders.
        </p>

    </div>


    <!-- STATS -->

    <div class="stats">


        <div class="stat">

            <h3>
                TOTAL ORDERS
            </h3>

            <div
                class="stat-number"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat">

            <h3>
                PENDING ORDERS
            </h3>

            <div
                class="stat-number"
                id="pendingOrders"
            >
                0
            </div>

        </div>


        <div class="stat">

            <h3>
                TOTAL SALES
            </h3>

            <div
                class="stat-number"
                id="totalSales"
            >
                ₹0
            </div>

        </div>


    </div>


    <!-- ORDERS -->

    <div
        class="orders"
        id="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>


</main>


<script>


/* =========================
   ADMIN TOKEN
========================= */

function getAdminToken(){

    return sessionStorage.getItem(
        "craftoraAdminToken"
    );

}


/* =========================
   CHECK LOGIN
========================= */

function checkAdminLogin(){

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(
    dateValue
){

    const date =
        new Date(
            dateValue
        );


    return date.toLocaleDateString(
        "en-IN",
        {

            day:"2-digit",

            month:"short",

            year:"numeric",

            hour:"2-digit",

            minute:"2-digit"

        }
    );

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    const container =
        document.getElementById(
            "orders"
        );


    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    try{

        const response =
            await fetch(
                "http://localhost:5000/api/admin/orders",
                {

                    method:"GET",

                    headers:{

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(
            !response.ok
        ){

            throw new Error(
                data.message ||
                "Unable to load orders."
            );

        }


        const orders =
            data.orders || [];


        /* TOTAL ORDERS */

        document.getElementById(
            "totalOrders"
        ).innerText =
            orders.length;


        /* PENDING */

        const pending =
            orders.filter(
                function(order){

                    return order.status ===
                        "Pending";

                }
            ).length;


        document.getElementById(
            "pendingOrders"
        ).innerText =
            pending;


        /* TOTAL SALES */

        const sales =
            orders.reduce(
                function(total,order){

                    return total +
                        Number(
                            order.total || 0
                        );

                },
                0
            );


        document.getElementById(
            "totalSales"
        ).innerText =
            "₹" +
            sales.toLocaleString(
                "en-IN"
            );


        /* NO ORDERS */

        if(
            orders.length === 0
        ){

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        Customer orders will appear here.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            "";


        /* RENDER ORDERS */

        orders.forEach(
            function(order){

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                let productsHTML =
                    "";


                const orderItems =
                    Array.isArray(
                        order.items
                    )
                    ? order.items
                    : [];


                orderItems.forEach(
                    function(item){

                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const itemTotal =
                            price *
                            quantity;


                        productsHTML += `

                            <div class="product">

                                <div class="product-image">
                                    ${item.image || "🛍️"}
                                </div>


                                <div class="product-info">

                                    <h3>
                                        ${item.name || "Product"}
                                    </h3>

                                    <p>
                                        Quantity:
                                        ${quantity}
                                    </p>

                                </div>


                                <div class="product-price">

                                    ₹${itemTotal.toLocaleString("en-IN")}

                                </div>

                            </div>

                        `;

                    }
                );


                const user =
                    order.userId || {};


                const customer =
                    order.customer || {};


                const status =
                    order.status ||
                    "Pending";


                card.innerHTML = `

                    <div class="order-header">


                        <div>

                            <div class="order-id">
                                Order #${order.orderNumber || "N/A"}
                            </div>


                            <div class="order-date">
                                ${formatDate(order.createdAt)}
                            </div>

                        </div>


                        <div class="status-area">


                            <select
                                class="status-select"
                                data-current="${status}"
                            >

                                <option
                                    value="Pending"
                                    ${status === "Pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>


                                <option
                                    value="Confirmed"
                                    ${status === "Confirmed" ? "selected" : ""}
                                >
                                    Confirmed
                                </option>


                                <option
                                    value="Shipped"
                                    ${status === "Shipped" ? "selected" : ""}
                                >
                                    Shipped
                                </option>


                                <option
                                    value="Delivered"
                                    ${status === "Delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>


                                <option
                                    value="Cancelled"
                                    ${status === "Cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>


                            <span
                                class="status-message"
                            ></span>


                        </div>


                    </div>


                    <div class="customer">


                        <div class="customer-box">

                            <h4>
                                CUSTOMER
                            </h4>

                            <p>
                                ${customer.name || user.name || "N/A"}
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                MOBILE
                            </h4>

                            <p>
                                ${customer.phone || user.mobile || "N/A"}
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                EMAIL
                            </h4>

                            <p>
                                ${customer.email || "N/A"}
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                ADDRESS
                            </h4>

                            <p>
                                ${customer.address || "N/A"}
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                CITY
                            </h4>

                            <p>
                                ${customer.city || "N/A"}
                            </p>

                        </div>


                        <div class="customer-box">

                            <h4>
                                PIN CODE
                            </h4>

                            <p>
                                ${customer.pincode || "N/A"}
                            </p>

                        </div>


                    </div>


                    <div class="products">

                        ${productsHTML}

                    </div>


                    <div class="order-footer">


                        <div class="payment">

                            Payment:

                            <strong>

                                ${String(
                                    order.paymentMethod ||
                                    "COD"
                                ).toUpperCase()}

                            </strong>

                        </div>


                        <div class="total">

                            Total:

                            <span>

                                ₹${Number(
                                    order.total || 0
                                ).toLocaleString("en-IN")}

                            </span>

                        </div>


                    </div>

                `;


                /* STATUS ELEMENTS */

                const select =
                    card.querySelector(
                        ".status-select"
                    );


                const message =
                    card.querySelector(
                        ".status-message"
                    );


                /* STATUS CHANGE */

                select.addEventListener(
                    "change",
                    function(){

                        updateOrderStatus(
                            order._id,
                            this.value,
                            this,
                            message
                        );

                    }
                );


                container.appendChild(
                    card
                );

            }
        );

    }


    catch(error){

        console.error(
            "Admin Error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <div class="error-icon">
                    ⚠️
                </div>

                <h2>
                    Unable to Load Orders
                </h2>

                <p>
                    ${error.message}
                </p>

                <button
                    class="retry"
                    onclick="loadOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =========================
   UPDATE ORDER STATUS
   NO ALERT
========================= */

async function updateOrderStatus(
    orderId,
    newStatus,
    selectElement,
    messageElement
){

    const token =
        getAdminToken();


    if(!token){

        window.location.href =
            "admin-login.html";

        return;

    }


    const previousStatus =
        selectElement.getAttribute(
            "data-current"
        );


    selectElement.disabled =
        true;


    messageElement.innerText =
        "Saving...";


    try{

        const response =
            await fetch(

                "http://localhost:5000/api/admin/orders/" +
                orderId +
                "/status",

                {

                    method:"PATCH",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }

            );


        const data =
            await response.json();


        if(
            response.status === 401
        ){

            sessionStorage.removeItem(
                "craftoraAdminToken"
            );

            sessionStorage.removeItem(
                "craftoraAdminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(
            !response.ok
        ){

            throw new Error(
                data.message ||
                "Unable to update order."
            );

        }


        selectElement.setAttribute(
            "data-current",
            newStatus
        );


        messageElement.innerText =
            "✓ Saved";


        setTimeout(
            function(){

                messageElement.innerText =
                    "";

            },
            1500
        );


        updatePendingCount(
            previousStatus,
            newStatus
        );

    }


    catch(error){

        console.error(
            "Status Error:",
            error
        );


        selectElement.value =
            previousStatus;


        messageElement.innerText =
            "Failed";


        setTimeout(
            function(){

                messageElement.innerText =
                    "";

            },
            2000
        );

    }


    finally{

        selectElement.disabled =
            false;

    }

}


/* =========================
   UPDATE PENDING COUNT
========================= */

function updatePendingCount(
    oldStatus,
    newStatus
){

    const pendingElement =
        document.getElementById(
            "pendingOrders"
        );


    let pending =
        Number(
            pendingElement.innerText
        ) || 0;


    if(
        oldStatus === "Pending" &&
        newStatus !== "Pending"
    ){

        pending--;

    }


    if(
        oldStatus !== "Pending" &&
        newStatus === "Pending"
    ){

        pending++;

    }


    if(
        pending < 0
    ){

        pending = 0;

    }


    pendingElement.innerText =
        pending;

}


/* =========================
   LOGOUT
========================= */

async function adminLogout(){

    const token =
        getAdminToken();


    if(token){

        try{

            await fetch(
                "http://localhost:5000/api/admin/logout",
                {

                    method:"POST",

                    headers:{

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );

        }

        catch(error){

            console.error(
                error
            );

        }

    }


    sessionStorage.removeItem(
        "craftoraAdminToken"
    );


    sessionStorage.removeItem(
        "craftoraAdminLoggedIn"
    );


    window.location.href =
        "admin-login.html";

}


/* =========================
   START
========================= */

if(
    checkAdminLogin()
){

    loadOrders();

}

</script>


</body>

</html>
